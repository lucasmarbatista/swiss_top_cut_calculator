<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG - Calculadora de Corte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Remove setinhas dos inputs number */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Swiss Top Cut Calculator</h1>
                    <p class="text-[11px] text-slate-400 font-medium tracking-wider uppercase">Swiss Math Auto-System</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col lg:flex-row gap-6">

        <!-- Configuração de tabela a esquerda e entradada de dados -->
        <div class="w-full lg:w-[40%] flex flex-col gap-5">

            <!-- Configuração do Torneio e IDs -->
            <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Configurações do Torneio</h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Corte</label>
                        <select id="cutConfig" onchange="calculate()" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 border bg-slate-50 outline-none transition-colors">
                            <option value="4">Top 4</option>
                            <option value="8" selected>Top 8</option>
                            <option value="8-assym">Top 8 Assimétrico</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <!-- Rodadas Restantes com botões de +(adicionar) e -(retirar) jogadores -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Rodadas Restantes</label>
                            <div class="flex rounded-lg shadow-sm">
                                <button type="button" onclick="document.getElementById('roundsLeft').stepDown(); calculate()" class="px-3 bg-slate-200 text-slate-600 rounded-l-lg border border-slate-300 border-r-0 hover:bg-slate-300 font-bold transition-colors focus:outline-none">−</button>
                                <input type="number" id="roundsLeft" value="1" min="1" oninput="calculate()" class="w-full border-slate-300 focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 bg-slate-50 outline-none transition-colors font-medium text-center border-y !rounded-none">
                                <button type="button" onclick="document.getElementById('roundsLeft').stepUp(); calculate()" class="px-3 bg-slate-200 text-slate-600 rounded-r-lg border border-slate-300 border-l-0 hover:bg-slate-300 font-bold transition-colors focus:outline-none">+</button>
                            </div>
                        </div>

                        <!-- Mesas de ID com botões de +(adicionar) e -(retirar) jogadores -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1" title="Empates Intencionais">Mesas de ID (Op)</label>
                            <div class="flex rounded-lg shadow-sm">
                                <button type="button" onclick="document.getElementById('idTables').stepDown(); calculate()" class="px-3 bg-slate-200 text-slate-600 rounded-l-lg border border-slate-300 border-r-0 hover:bg-slate-300 font-bold transition-colors focus:outline-none">−</button>
                                <input type="number" id="idTables" value="0" min="0" oninput="calculate()" class="w-full border-slate-300 focus:border-emerald-500 focus:ring-emerald-500 text-sm p-2 bg-slate-50 outline-none transition-colors font-medium text-center text-amber-700 border-y !rounded-none">
                                <button type="button" onclick="document.getElementById('idTables').stepUp(); calculate()" class="px-3 bg-slate-200 text-slate-600 rounded-r-lg border border-slate-300 border-l-0 hover:bg-slate-300 font-bold transition-colors focus:outline-none">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Brackets de pontuação -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col flex-grow">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80 rounded-t-xl">
                    <h2 class="text-xs font-bold text-slate-600 uppercase tracking-wider">Brackets de Pontuação</h2>
                </div>

                <!-- Headers das colunas de Input -->
                <div class="grid grid-cols-12 gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider px-5 pt-4 pb-2 border-b border-slate-50">
                    <div class="col-span-5 text-center">Jogadores</div>
                    <div class="col-span-5 text-center">Pontos</div>
                    <div class="col-span-2 text-center">Ação</div>
                </div>

                <!-- Container Dinâmico -->
                <div id="bracketsContainer" class="p-4 pt-2 space-y-2 max-h-[400px] overflow-y-auto custom-scrollbar">
                    <!-- JS -->
                </div>

                <!-- Botão para adicionar -->
                <div class="p-4 pt-2 border-t border-slate-100">
                    <button onclick="addBracketRow()" class="w-full text-sm font-semibold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Adicionar Bracket
                    </button>
                </div>
            </section>
        </div>

        <!-- Tabela a direita e os resultados -->
        <div class="w-full lg:w-[60%] flex flex-col gap-5">
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="p-5 border-b border-slate-100 bg-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Análise Matemática</h2>

                    <div class="flex gap-4 text-lg font-semibold text-slate-600 bg-slate-50 px-3 py-1.5 rounded-md border border-slate-100">
                        <div>Corte Atual: <span id="lblCurrentCut" class="text-slate-800">0</span></div>
                        <div class="border-l border-slate-300 pl-4">Corte Projetado: <span id="lblExpectedCut" class="text-emerald-600">0</span></div>
                    </div>
                </div>

                <div class="custom-scrollbar overflow-x-auto p-0">
                    <table class="w-full text-left border-collapse min-w-[650px]">
                        <thead>
                            <tr class="bg-slate-50 text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-200">
                                <th class="p-4 font-semibold text-center">Pontuação Atual</th>
                                <th class="p-4 font-semibold text-center">Qtd Jogadores</th>
                                <th class="p-4 font-semibold text-center">Pontos Máx.</th>
                                <th class="p-4 font-semibold text-center">Status</th>
                                <th class="p-4 font-semibold text-center">Chance de Bolha</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody" class="divide-y divide-slate-100">
                            <!-- Para para injeção do código em JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Tabela de Top 16 -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="p-4 border-b border-slate-100 bg-white">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Top 16 (Standings Atuais)</h2>
                </div>
                <div class="custom-scrollbar overflow-x-auto p-0 max-h-[300px]">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-200">
                                <th class="p-3 font-semibold text-center w-24">Posição</th>
                                <th class="p-3 font-semibold text-center">Pontuação</th>
                            </tr>
                        </thead>
                        <tbody id="top16TableBody" class="divide-y divide-slate-100">
                            <!-- Para para injeção do código em JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        // Array para manter os dados de entrada
        let brackets = [];
        let nextId = 0;

        // Inicializa com dados padrão
        document.addEventListener('DOMContentLoaded', () => {
            addBracketRow(1, 15);
            addBracketRow(3, 13);
            addBracketRow(4, 12);
            addBracketRow(3, 11);
            addBracketRow(3, 10);
            addBracketRow(5, 9);
            calculate();
        });

        // Adiciona uma nova linha de bracket
        function addBracketRow(count = 1, pts = 0) {
            brackets.push({ id: nextId++, count: count, points: pts });
            renderBrackets();
            calculate();
        }

        // Remove uma linha pelo ID
        function removeBracketRow(id) {
            brackets = brackets.filter(b => b.id !== id);
            renderBrackets();
            calculate();
        }

        // Atualiza valor de um bracket específico
        function updateBracket(id, field, value) {
            const bracket = brackets.find(b => b.id === id);
            if (bracket) {
                bracket[field] = parseInt(value, 10) || 0;
                calculate();
            }
        }

        // Renderiza os inputs de bracket na tela
        function renderBrackets() {
            const container = document.getElementById('bracketsContainer');
            container.innerHTML = '';

            brackets.forEach(bracket => {
                const div = document.createElement('div');
                div.className = 'grid grid-cols-12 gap-2 items-center bg-white p-2 rounded-lg border border-slate-200 shadow-sm transition-all focus-within:ring-1 focus-within:ring-emerald-500 focus-within:border-emerald-500';

                div.innerHTML = `
                    <div class="col-span-5">
                        <input type="number" oninput="updateBracket(${bracket.id}, 'count', this.value)" value="${bracket.count}" class="w-full rounded text-sm text-center p-1.5 focus:outline-none font-semibold text-slate-700 bg-transparent" min="1">
                    </div>
                    <div class="col-span-5 border-l border-slate-200">
                        <input type="number" oninput="updateBracket(${bracket.id}, 'points', this.value)" value="${bracket.points}" class="w-full rounded text-sm text-center p-1.5 focus:outline-none font-semibold text-emerald-700 bg-transparent" min="0">
                    </div>
                    <div class="col-span-2 flex justify-center border-l border-slate-200">
                        <button type="button" onclick="removeBracketRow(${bracket.id})" class="text-slate-400 hover:text-red-500 p-1.5 rounded-md hover:bg-red-50 transition-colors" title="Remover">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Executa o cálculo
        function calculate() {
            const cutConfig = document.getElementById('cutConfig').value;
            const roundsLeft = parseInt(document.getElementById('roundsLeft').value, 10) || 0;
            const idTables = parseInt(document.getElementById('idTables').value, 10) || 0;

            const isAsymmetric = cutConfig === '8-assym';
            const cutSize = cutConfig.includes('4') ? 4 : 8;

            let allPlayers = [];

            // 1. Expande os brackets
            brackets.forEach(b => {
                if(b.count > 0) {
                    for(let i = 0; i < b.count; i++) {
                        allPlayers.push(b.points);
                    }
                }
            });

            // Caso não tenha dados suficientes
            const tbody = document.getElementById('resultsTableBody');
            const top16Tbody = document.getElementById('top16TableBody');

            if (allPlayers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400 text-sm">Adicione os brackets de pontuação para calcular.</td></tr>`;
                top16Tbody.innerHTML = `<tr><td colspan="2" class="p-8 text-center text-slate-400 text-sm">Sem dados de jogadores.</td></tr>`;
                document.getElementById('lblCurrentCut').innerText = '0';
                document.getElementById('lblExpectedCut').innerText = '0';
                return;
            }

            // 2. Ordena os resultados por pontos (De forma descendente)
            allPlayers.sort((a, b) => b - a);

            // Constroi a tabela do Top 16
            top16Tbody.innerHTML = '';
            const limit16 = Math.min(16, allPlayers.length);
            for (let i = 0; i < limit16; i++) {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="p-2 text-center">
                        <span class="text-sm font-bold text-slate-500">${i + 1}º</span>
                    </td>
                    <td class="p-2 text-center">
                        <span class="text-sm font-bold text-slate-800">${allPlayers[i]}</span>
                    </td>
                `;
                top16Tbody.appendChild(tr);
            }

            // 3. Adiciona pontos de ID no topo (1 mesa = 2 jogadores que ganham +1 ponto)
            if (idTables > 0) {
                const affectedPlayers = Math.min(idTables * 2, allPlayers.length);
                for (let i = 0; i < affectedPlayers; i++) {
                    allPlayers[i] += 1;
                }
                // Reordenar após IDs
                allPlayers.sort((a, b) => b - a);
            }

            // 4. Determina currentCutScore
            const cutIndex = cutSize - 1;
            const currentCutScore = allPlayers.length > cutIndex ? allPlayers[cutIndex] : 0;

            // 5. Determina expectedCutScore (Regra do Math.floor(Rounds * 1.5))
            const expectedCutScore = currentCutScore + Math.floor(roundsLeft * 1.5);

            // Atualiza UI
            document.getElementById('lblCurrentCut').innerText = currentCutScore;
            document.getElementById('lblExpectedCut').innerText = expectedCutScore;

            // Ordena os brackets para a renderização final (do maior pro menor)
            const sortedBrackets = [...brackets].sort((a, b) => b.points - a.points);
            tbody.innerHTML = '';

            // 6. Avalia cada bracket individualmente
            sortedBrackets.forEach(bracket => {
                if (bracket.count <= 0) return;

                const score = bracket.points;
                const maxPotential = score + (roundsLeft * 3);
                const drawPotential = score + (roundsLeft * 1);

                let status = "";
                let bolha = "";
                let statusBadgeClass = "";
                let bolhaBadgeClass = "";

                // Implementa lógica de corte do modo suíco.
                if (maxPotential < currentCutScore) {
                    status = "Sem chance";
                    statusBadgeClass = "bg-red-100 text-red-700 border-red-200";
                    bolha = "Não";
                }
                else if (score >= expectedCutScore) {
                    status = "Já classificado";
                    statusBadgeClass = "bg-emerald-100 text-emerald-700 border-emerald-200";
                    bolha = "Não";
                }
                else if (drawPotential >= expectedCutScore) {
                    status = "Com chance ao empatar";
                    statusBadgeClass = "bg-blue-100 text-blue-700 border-blue-200";
                    bolha = (drawPotential === expectedCutScore) ? "Sim" : "Não";
                }
                else {
                    // Necessita Vencer
                    status = "Necessita vencer";
                    statusBadgeClass = "bg-orange-100 text-orange-700 border-orange-200";

                    // Condição de "Bolha" para quem precisa vencer
                    if ( (maxPotential >= expectedCutScore - 1 && maxPotential <= expectedCutScore + 1) ||
                         (isAsymmetric && maxPotential === currentCutScore) ) {
                        bolha = "Sim";
                    } else {
                        // Se maxPotential > expectedCutScore + 1, passa direto, então não é
                        // coinsiderado em estado de "Bolha".
                        bolha = "Não";
                    }
                }

                // Tip de texto para a coluna de "Bolha"
                if (bolha === "Sim") {
                    bolhaBadgeClass = "bg-yellow-100 text-yellow-800 border-yellow-300 font-bold";
                } else {
                    bolhaBadgeClass = "bg-slate-100 text-slate-500 border-slate-200 font-medium";
                }

                // Cria a linha da tabela
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";

                tr.innerHTML = `
                    <td class="p-3 text-center">
                        <span class="text-sm font-bold text-slate-800">${score}</span>
                    </td>
                    <td class="p-3 text-center">
                        <span class="text-sm font-medium text-slate-600">${bracket.count}</span>
                    </td>
                    <td class="p-3 text-center">
                        <span class="text-sm font-semibold text-slate-600">${maxPotential}</span>
                    </td>
                    <td class="p-3 text-center">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-md border text-xs font-bold uppercase tracking-wide shadow-sm ${statusBadgeClass}">
                            ${status}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-md border text-xs uppercase tracking-wide shadow-sm ${bolhaBadgeClass}">
                            ${bolha}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
